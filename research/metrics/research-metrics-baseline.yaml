baseline_date: 2026-08-03

measurement_principles:
  - Metrics are indicators and do not replace evidence or governance judgment.
  - Counts shall be derived from canonical registries where possible.
  - Unknown values shall remain null rather than be estimated as fact.
  - Historical and novel evidence shall be measured separately.
  - Failed experiments and environment failures shall be counted.


required_fields:
  - id
  - title
  - version
  - status
  - program
  - experiment
  - platform
  - evidence_classes
  - canonical_path
  - verified
  - reproducible
  - related_objects
  - limitations

integrity_rules:
  - canonical_document_required_before_status_accepted
  - accepted_evidence_must_be_verified
  - accepted_evidence_must_include_limitations
  - failed_results_must_not_be_removed
  - inference_must_not_be_recorded_as_observed_fact
  - environment_context_required_for_executable_evidence
  - superseded_evidence_must_reference_replacement

registry_id: ROS-EVIDENCE-2026-001
title: Operational Evidence Registry
version: "1.0"
status: active
owner: Institution Design Studio
governing_document: ROS-2026-001

evidence_classes:
  static_repository:
    description: Evidence derived from repository structure, files, or configuration without execution.
  development:
    description: Evidence generated during implementation, refactoring, or defect correction.
  controlled_test:
    description: Evidence generated by repeatable automated or manual tests.
  integration:
    description: Evidence generated by interactions between multiple components.
  runtime:
    description: Evidence generated by executing the application or service.
  operational_usage:
    description: Evidence generated through actual operational or user activity.
  failure:
    description: Evidence of unsuccessful execution, unmet criteria, or defects.
  environmental:
    description: Evidence about runtime, dependency, configuration, or infrastructure conditions.
  comparative:
    description: Evidence comparing alternatives, versions, domains, or platforms.
  cross_domain:
    description: Evidence supporting or contradicting a pattern across multiple domains.
  cross_platform:
    description: Evidence supporting or contradicting a pattern across multiple platforms.
  historical_reproduction:
    description: Reproduction of verification performed during prior development.
  novel_development:
    description: Evidence generated while completing new or unfinished development.

evidence_statuses:
  - captured
  - verified
  - classified
  - accepted
  - superseded
  - archived


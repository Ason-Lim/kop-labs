registry_id: ROS-RELATIONSHIP-2026-001
title: Research Object Relationship Type Registry
version: "1.0"
status: active
owner: Institution Design Studio
governing_document: ROS-2026-001

relationship_types:
  belongs_to:
    inverse: contains
    description: The source object is part of the target Program, Sprint, Case, or Release.
    allowed_sources: ["*"]
    allowed_targets: [RP, SPRINT, ORC, RELEASE]
    transitive: false

  contains:
    inverse: belongs_to
    description: The source object contains or groups the target object.
    allowed_sources: [RP, SPRINT, ORC, RELEASE, FP]
    allowed_targets: ["*"]
    transitive: false

  answers:
    inverse: answered_by
    description: The source object provides an answer or partial answer to a Research Question.
    allowed_sources: [VAL, RM, FTR]
    allowed_targets: [RQ]
    transitive: false

  answered_by:
    inverse: answers
    description: The source Research Question is answered by the target object.
    allowed_sources: [RQ]
    allowed_targets: [VAL, RM, FTR]
    transitive: false

  tests:
    inverse: tested_by
    description: The source Experiment or inquiry tests the target Hypothesis or Model.
    allowed_sources: [EXP, AR, VAL]
    allowed_targets: [H, RM]
    transitive: false

  tested_by:
    inverse: tests
    description: The source Hypothesis or Model is tested by the target object.
    allowed_sources: [H, RM]
    allowed_targets: [EXP, AR, VAL]
    transitive: false

  implements:
    inverse: implemented_by
    description: The source development artifact or case implements the target model, architecture, or decision.
    allowed_sources: [ORC, EXP]
    allowed_targets: [RM, AR]
    transitive: false

  implemented_by:
    inverse: implements
    description: The source model or architecture is implemented by the target case or experiment.
    allowed_sources: [RM, AR]
    allowed_targets: [ORC, EXP]
    transitive: false

  produces:
    inverse: produced_by
    description: The source object generates the target Research Object.
    allowed_sources: [EXP, VAL, RM, SPRINT]
    allowed_targets: [OE, VAL, RMILESTONE, RELEASE, RQ]
    transitive: false

  produced_by:
    inverse: produces
    description: The source object was generated by the target object.
    allowed_sources: [OE, VAL, RMILESTONE, RELEASE, RQ]
    allowed_targets: [EXP, VAL, RM, SPRINT]
    transitive: false

  validates:
    inverse: validated_by
    description: The source Validation evaluates and issues a decision about the target object.
    allowed_sources: [VAL]
    allowed_targets: [OE, H, RM, EXP, ORC]
    transitive: false

  validated_by:
    inverse: validates
    description: The source object is evaluated by the target Validation.
    allowed_sources: [OE, H, RM, EXP, ORC]
    allowed_targets: [VAL]
    transitive: false

  revises:
    inverse: revised_by
    description: The source object changes or updates the target object.
    allowed_sources: [RM, ROS, ROADMAP, RP]
    allowed_targets: [RM, ROS, ROADMAP, RP]
    transitive: false

  revised_by:
    inverse: revises
    description: The source object is revised by the target object.
    allowed_sources: [RM, ROS, ROADMAP, RP]
    allowed_targets: [RM, ROS, ROADMAP, RP]
    transitive: false

  supersedes:
    inverse: superseded_by
    description: The source object replaces the target as the canonical active record.
    allowed_sources: ["*"]
    allowed_targets: ["*"]
    transitive: true

  superseded_by:
    inverse: supersedes
    description: The source object is replaced by the target object.
    allowed_sources: ["*"]
    allowed_targets: ["*"]
    transitive: true

  supports:
    inverse: supported_by
    description: The source evidence or validation supports the target statement, hypothesis, or model.
    allowed_sources: [OE, VAL, RM]
    allowed_targets: [H, RM, FTR, FP]
    transitive: false

  supported_by:
    inverse: supports
    description: The source statement, hypothesis, or model is supported by the target object.
    allowed_sources: [H, RM, FTR, FP]
    allowed_targets: [OE, VAL, RM]
    transitive: false

  contradicts:
    inverse: contradicted_by
    description: The source evidence or validation contradicts the target statement, hypothesis, or model.
    allowed_sources: [OE, VAL, RM]
    allowed_targets: [H, RM, FTR, FP]
    transitive: false

  contradicted_by:
    inverse: contradicts
    description: The source statement, hypothesis, or model is contradicted by the target object.
    allowed_sources: [H, RM, FTR, FP]
    allowed_targets: [OE, VAL, RM]
    transitive: false

  depends_on:
    inverse: required_by
    description: The source object requires the target object to proceed or remain valid.
    allowed_sources: ["*"]
    allowed_targets: ["*"]
    transitive: true

  required_by:
    inverse: depends_on
    description: The source object is required by the target object.
    allowed_sources: ["*"]
    allowed_targets: ["*"]
    transitive: true

  governed_by:
    inverse: governs
    description: The source object is governed by the target authority, policy, Program, or reference.
    allowed_sources: ["*"]
    allowed_targets: [RP, ROS, RM, JDM]
    transitive: true

  governs:
    inverse: governed_by
    description: The source object governs the target object.
    allowed_sources: [RP, ROS, RM, JDM]
    allowed_targets: ["*"]
    transitive: true

  derived_from:
    inverse: source_for
    description: The source object was derived from the target observation, evidence, or model.
    allowed_sources: ["*"]
    allowed_targets: [DN, OE, VAL, RM, AR]
    transitive: true

  source_for:
    inverse: derived_from
    description: The source object is an origin for the target object.
    allowed_sources: [DN, OE, VAL, RM, AR]
    allowed_targets: ["*"]
    transitive: true

  included_in:
    inverse: includes
    description: The source object is included in the target package, Proposal, Sprint, or Release.
    allowed_sources: ["*"]
    allowed_targets: [FP, SPRINT, RELEASE]
    transitive: false

  includes:
    inverse: included_in
    description: The source package, Proposal, Sprint, or Release includes the target object.
    allowed_sources: [FP, SPRINT, RELEASE]
    allowed_targets: ["*"]
    transitive: false

  triggers:
    inverse: triggered_by
    description: The source result initiates the target research or governance activity.
    allowed_sources: [OE, VAL, RM, RMILESTONE, JDM]
    allowed_targets: [RQ, EXP, AR, RM, FTR, FP, SPRINT]
    transitive: false

  triggered_by:
    inverse: triggers
    description: The source activity was initiated by the target result.
    allowed_sources: [RQ, EXP, AR, RM, FTR, FP, SPRINT]
    allowed_targets: [OE, VAL, RM, RMILESTONE, JDM]
    transitive: false

relationship_record_required_fields:
  - source_id
  - relationship_type
  - target_id
  - established_date
  - basis

validation_rules:
  - relationship_type_must_exist
  - source_and_target_must_be_registered
  - inverse_relationship_should_be_derivable
  - prohibited_self_relationships_must_be_rejected
  - supersedes_requires_version_or_canonicality_basis
